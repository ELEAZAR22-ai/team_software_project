<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />


    <title>taaa</title>
    <style>
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }

        .data-table thead {
            background: #f3f4f6;
        }

        .data-table th,
        .data-table td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        .data-table tbody tr:hover {
            background: #f9fafb;
        }
    </style>
</head>

<body>
    <table class="data-table" aria-label="Products table">
        <thead>
            <tr>
                <th>Product</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Widget A</td>
                <td>Gadgets</td>
                <td>$19.99</td>
                <td>42</td>
            </tr>
            <tr>
                <td>Widget B</td>
                <td>Gadgets</td>
                <td>$29.99</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Gizmo X</td>
                <td>Tools</td>
                <td>$9.99</td>
                <td>120</td>
            </tr>
        </tbody>
    </table>
</body>
