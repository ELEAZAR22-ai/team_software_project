    <section id="home" class="hero">
        <div class="container">

            <div id="countdown" aria-live="polite" style="font-weight:600; font-size:1.25rem; margin: 1rem 0;">
                Loading countdown...
            </div>
            <h2> REGISTER TO COUNT YOURSELF APART OF THE COMMUNITY......</h2>
            <a href="register.html" class="btn-primary">REGISTER NOW....</a>
        </div>
    </section>
    <script>

        const targetDate = new Date("2025-12-31T23:59:59").getTime();

        const countdownEl = document.getElementById("countdown");

        function updateCountdown() {
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff <= 0) {
                countdownEl.textContent = "Launch started or event occurred!";
                clearInterval(timer);
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            countdownEl.textContent = `Launch in ${days}d ${hours}h ${minutes}m ${seconds}s`;
        }

        updateCountdown();
        const timer = setInterval(updateCountdown, 1000);
    </script>
</body>
