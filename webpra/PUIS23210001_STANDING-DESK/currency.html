<!DOCTYPE html5>

<html lang="en">
<meta charset="UTF-8">
<meta name="viewport" content="width=device, initail-sacle=1.0">

<head>
    <title>convertor</title>
    <style>
        body {
            background: linear-gradient(#ff44, #3b3b, #ee4e);
            width: 100%;
            height: 100dvh;
        }

        .header {
            display: flex;
            background: rgba(179, 179, 48, 0.933);
            width: 100%;
            height: 100px;
        }

        .hearder img {
            width: 100px;
        }

        .history-wrapper {
            overflow: hidden;
            border-radius: 6px;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            margin-left: 10px;
        }

        #historyPanel {
            height: 0;
            overflow: hidden;
            transition: height 0.25s ease;
        }

        #historyPanel.open {
            max-height: 400px;
            height: auto;
        }

        #historyList li {
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }


        .container {
            display: absolute;
            background-color: rgb(144, 34, 148);
            justify-content: center;
            align-items: center;
            padding: 70px;
            width: 450px;
            height: 370px;
            border-radius: 10px;
            margin-left: 350px;

        }

        .currency-converter_input {
            width: 100%;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            text-align: center;
            outline: solid 2px transparent;
            color: #ffff;
            margin-bottom: 45px;
        }

        .currency-converter_select-group {
            border: solid;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;

        }

        select {
            background: none;
            border: none;
            font-size: 18px;
            font-weight: 550;
            width: 65px;
            outline: none;

        }

        option {
            font-size: 16px;
            background: rgb(95, 31, 168);

        }

        .currency-converter_swap-button {
            background: rgba(179, 179, 48, 0.933);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 40px;
            border-radius: 100%;
            border: solid 2px rgba(0, 0, 0, 0.7);
        }

        .currency-converter_swap-button i {
            justify-content: center;
            align-items: center;
            margin: 10px;
            display: flex;
            font-weight: 600;
            cursor: pointer;
            font-size: 40px;
        }

        .currency-converter_swap-button:active {
            transform: scale(0.95);
        }

        .currency-converter_swap-button i {
            color: var(--dark-gray);
            font-size: 20px;
        }

        .currency-coverter_exchange-rate {
            border: solid 2px rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding-block: 10px;
            margin-top: 40px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            color: #ffff;
        }

        .currency-coverter_exchange-rate:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .currency-converter_convereter-button {
            margin-top: 30px;
            width: 100%;
            padding-block: 8px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 60px;
            background-color: rgb(138, 63, 156);
            color: #000000;
            cursor: pointer;
        }

        .currency-converter_convereter-button:active {
            transform: scale(0.95);
        }

        footer {
            width: 100%;
            height: 70px;
            background: rgb(95, 31, 168);
        }

        .data-table {
            border: rgba(214, 18, 132, 0.933);
            width: 350px;
            border-collapse: collapse;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            color: azure;
            margin-left: 20px;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="images/logo.webp" />
        <i data-lucide="hand-coins" class="w-6 h-6 mr-2"></i>
        <section class="history-wrapper" aria-label="Conversion History Menu">
            <button id="historyToggle" aria-expanded="false" aria-controls="historyPanel"
                title="Open conversion history">History</button>
            <div id="historyPanel" class="history-panel" role="region" aria-label="Conversion History Panel">
                <div class="history-panel-inner">
                    <ul id="historyList" class="menu" style="padding-left:0; margin:0;">
                        <!-- items injected by JS -->
                    </ul>
                    <button id="clearHistory" type="button" style="margin-top:6px;">Clear History</button>
                </div>
            </div>
            </select>

    </div>
    <div class="container">
        <h2>CURRENCY CONVERTER...</h2>
        <input class="currency-converter_input" placeholder="0" type="number" id="inputsourcecurrency" required />
        <div class="currency-converter_select-group">

            <!--!img src="https://flagcdn.com/w640/us.png"--->
            <select id="selectsourcecurrency">
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GH">GH</option>
                <option value="NAIRA">NAIRA</option>
                <option value="YAN">YAN</option>
                <option value="GBP">GBP</option>
                <option value="YUAN">YUAN</option>
            </select>
            <div id="buttonSwap" class="currency-converter_swap-button">
                <i class="fas fa-exchange-alt">↔</i>
            </div>
            <select id="selectTargetcurrency">
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GH">GH</option>
                <option value="NAIRA">NAIRA</option>
                <option value="YAN">YAN</option>
                <option value="GBP">GBP</option>
                <option value="YUAN">YUAN</option>
            </select>


        </div>

        <div class="currency-coverter_exchange-rate">
            <span id="exchangeRateText" class="currency-converter_exchange-rate-text">
                0 USD = 0 EUR
            </span>
        </div>

        <button id="currencyConvert" class="currency-converter_convereter-button">
            Convert
        </button>
    </div>

    <footer>
        <table class="data-table" aria-label="Products table">
            <thead>
                <tr>
                    <th>STUDENT NAME</th>
                    <th>SUBMMISION DATE</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>NARTEH ELEAZAR</td>
                    <td>19th NOVEMBER, 2025.</td>
                </tr>
            </tbody>
        </table>

    </footer>
</body>
<script>
    (function () {
        // 1) Rate table (base: 1 unit of fromCurrency equals rateToUSD units)
        // For simplicity, rates are defined relative to USD as a common base.
        // Approach: convert source amount to USD, then from USD to target.
        const RATES_TO_USD = {
            // 1 unit of currency -> USD
            // These are placeholder example rates; replace with real data as needed.
            USD: 1,
            EUR: 1.08,     // 1 EUR ≈ 1.08 USD
            GH: 0.14,      // 1 GH ≈ 0.14 USD
            NAIRA: 0.0026, // 1 NAIRA ≈ 0.0026 USD
            YAN: 0.15,     // 1 YAN ≈ 0.15 USD
            GBP: 1.25,     // 1 GBP ≈ 1.25 USD
            YUAN: 0.14      // 1 YUAN ≈ 0.14 USD
        };

        // Optional: a rate lookup helper to ensure we only use known currencies
        const currencies = Object.keys(RATES_TO_USD);

        // 2) DOM elements
        const inputSource = document.getElementById('inputsourcecurrency');
        const selectSource = document.getElementById('selectsourcecurrency');
        const selectTarget = document.getElementById('selectTargetcurrency');
        const btnSwap = document.getElementById('buttonSwap');
        const exchangeRateText = document.getElementById('exchangeRateText');
        const currencyConvertBtn = document.getElementById('currencyConvert');
        const historyList = document.getElementById('historyList');
        const clearHistoryBtn = document.getElementById('clearHistory');

        // History storage key
        const HISTORY_KEY = 'currency_converter_history_v1';

        // State
        let history = [];

        // 3) Initialize
        function loadHistory() {
            try {
                const raw = localStorage.getItem(HISTORY_KEY);
                if (raw) {
                    history = JSON.parse(raw);
                    renderHistory();
                }
            } catch (e) {
                console.warn('Could not load history', e);
            }
        }

        function saveHistory() {
            try {
                localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            } catch (e) {
                console.warn('Could not save history', e);
            }
        }

        function renderHistory() {
            historyList.innerHTML = '';
            if (!history.length) {
                const li = document.createElement('li');
                li.textContent = 'No conversions yet.';
                li.style.listStyle = 'none';
                historyList.appendChild(li);
                return;
            }
            history.forEach(item => {
                const li = document.createElement('li');
                li.style.listStyle = 'none';
                li.style.padding = '6px 0';
                li.textContent = `${item.fromAmount} ${item.from} → ${item.toAmount} ${item.to} @ ${item.rateInfo}`;
                historyList.appendChild(li);
            });
        }


        // 4) Helpers
        function formatMoney(value) {
            // You can adjust locale/currency formatting as needed
            return Number(value).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 6 });
        }

        function getRate(from, to) {
            // Convert from -> USD, then USD -> to
            const fromRate = RATES_TO_USD[from];
            const toRate = RATES_TO_USD[to];
            if (fromRate == null || toRate == null) return null;
            // 1 unit of 'from' => (fromRate) USD; 1 USD => 1/toRate of 'to'
            const toUSD = fromRate;
            const usdToTarget = 1 / toRate;
            const rate = toUSD * usdToTarget;
            // Return a human-friendly rate: 1 from = rate to
            return rate;
        }

        function updateExchangeInfo() {
            const from = selectSource.value;
            const to = selectTarget.value;
            const rate = getRate(from, to);
            if (rate == null) {
                exchangeRateText.textContent = 'Rate unavailable';
                return;
            }
            // Show rate like: 1 USD = X TARGET
            // But since we compute with a single rate, we can present both directions clearly
            exchangeRateText.textContent = `1 ${from} ≈ ${formatMoney(rate)} ${to}`;
        }

        function performConversion() {
            const rawValue = Number(inputSource.value);
            if (isNaN(rawValue)) {
                alert('Please enter a valid numeric amount.');
                return null;
            }
            const from = selectSource.value;
            const to = selectTarget.value;
            const rate = getRate(from, to);
            if (rate == null) {
                alert('Conversion rate unavailable for selected currencies.');
                return null;
            }
            const converted = rawValue * rate;
            return {
                fromAmount: rawValue,
                from,
                toAmount: formatMoney(converted),
                to
            };
        }

        // 5) Event handlers
        currencyConvertBtn.addEventListener('click', () => {
            const result = performConversion();
            if (result) {
                // Show result in a simple alert or you could render it in the UI
                alert(`${result.fromAmount} ${result.from} = ${result.toAmount} ${result.to}`);
                // Optionally push to history immediately
                const entry = {
                    time: new Date().toLocaleString(),
                    fromAmount: result.fromAmount,
                    from: result.from,
                    toAmount: result.toAmount,
                    to: result.to,
                    rateInfo: `1 ${result.from} = ${getRate(result.from, result.to).toFixed(6)} ${result.to}`
                };
                history.unshift({ ...entry });
                // keep history list small
                if (history.length > 50) history.pop();
                saveHistory();
                renderHistory();
            }
        });


        btnSwap.addEventListener('click', () => {
            const from = selectSource.value;
            const to = selectTarget.value;
            // Swap values
            selectSource.value = to;
            selectTarget.value = from;
            updateExchangeInfo();
        });

        clearHistoryBtn.addEventListener('click', () => {
            history = [];
            saveHistory();
            renderHistory();
        });

        // Live update when currencies change
        selectSource.addEventListener('change', updateExchangeInfo);
        selectTarget.addEventListener('change', updateExchangeInfo);

        // Init
        function init() {
            // Ensure select elements have valid options
            // If you want dynamic population, you can build options from `currencies` array
            loadHistory();
            updateExchangeInfo();
            // Optional: set a default input value
            inputSource.value = inputSource.value || '1';
        }

        // Run after DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();


</script>

</html>
