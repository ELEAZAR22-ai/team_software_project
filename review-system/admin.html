<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Review System</title>
    <link rel="stylesheet" href="adminstyle.css">
</head>

<body>

    <header class="main-header">
        <div class="logo"> <img src="log.png" alt="Logo" class="logo-image">
            Pentecost University</div>
        <h1>Review System</h1>
        <button id="theme-toggle" class="mode-btn">🌓 Switch Mode</button>
    </header>

    <div class="container">
        <div class="login-card">
            <h2>Stuffs Login</h2>
            <form id="loginForm">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Username" required>
                </div>

                <div class="input-group password-wrapper">
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="button" id="togglePassword" class="toggle-icon">👁️</button>
                </div>

                <div class="button-group">
                    <button type="button" class="btn btn-submit" onclick="handleSubmit()">Submit</button>
                    <button type="button" class="btn btn-cancel">Cancel</button>
                    <button type="reset" class="btn btn-clear">Clear</button>
                </div>
            </form>

            <div class="contact-info">
                <p>contact offcials: 0304575857/0304557576</p><br>
                <p>email: Admin@gmail.com</p>
            </div>
        </div>

        <div class="comment-section">
            <h3>Student Feedback</h3>
            <textarea placeholder="Students: Leave your comments here..."></textarea>
            <button class="btn-submit">Post Comment</button>
        </div>
    </div>

    <script>
        // Toggle Password Visibility
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');

        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // Theme Toggle
        const themeToggle = document.querySelector('#theme-toggle');
        themeToggle.addEventListener('click', function () {
            document.body.classList.toggle('dark');
            this.textContent = document.body.classList.contains('dark') ? '☀️ Light Mode' : '🌓 Switch Mode';
        });

        // Submit Confirmation Popup
        function handleSubmit() {
            const response = confirm("Do you want to submit?");
            if (response) {
                alert("Credentials submitted successfully.");
            } else {
                alert("Submission cancelled.");
            }
        }
    </script>
</body>

</html>
